name: Build Waymark v5 APK
on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reassemble Waymark v5 source
        run: |
          : > waymark-v5-source.b64
          head -c 19999 waymark-v5-src/part_00 >> waymark-v5-source.b64
          head -c 16001 waymark-v5-src/part_01 >> waymark-v5-source.b64
          head -c 4171 waymark-v5-src/part_02 >> waymark-v5-source.b64
          head -c 13829 waymark-v5-src/part_02b >> waymark-v5-source.b64
          head -c 33479 waymark-v5-src/part_03 >> waymark-v5-source.b64
          printf 'A' >> waymark-v5-source.b64
          test "$(wc -c < waymark-v5-source.b64)" -eq 87480
          base64 -d waymark-v5-source.b64 > Waymark-v5-source.zip
          unzip -t Waymark-v5-source.zip
          unzip -q Waymark-v5-source.zip
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: FieldKeepMVP
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Waymark-v5-functional-apk
          path: FieldKeepMVP/app/build/outputs/apk/debug/app-debug.apk
